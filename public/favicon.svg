<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1769AA"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background rounded badge -->
  <rect width="64" height="64" rx="16" fill="url(#medGrad)"/>

  <!-- Inner subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Medical Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="26" y="14" width="12" height="36" rx="4" fill="#FFFFFF"/>
    <!-- Horizontal Cross Bar -->
    <rect x="14" y="26" width="36" height="12" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Pulse Heartbeat Line -->
  <path d="M16 32 L25 32 L28 22 L34 42 L38 27 L41 34 L48 32" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
